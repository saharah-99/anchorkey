[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anchorkey"
version = "0.1.0"
description = "Auditable provenance for observed-entity telemetry: identity resolution under identifier drift, with tamper-evident sealing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Rahul Saha" }]
keywords = ["iot", "telemetry", "identity-resolution", "entity-resolution", "data-quality", "natural-key"]

# The core library has ZERO runtime dependencies — it is pure standard library, on
# purpose: identity logic this important should be easy to read and to vendor.
dependencies = []

[project.optional-dependencies]
# Only the test suite and the figure script need extras.
dev = ["pytest>=8", "hypothesis>=6"]
figures = ["matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/saharah-99/anchorkey"

[tool.setuptools.packages.find]
where = ["src"]
