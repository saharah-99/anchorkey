# ─────────────────────────────────────────────────────────────────────────────
# GitHub traffic archiver for the anchorkey repo.
#
# WHY: GitHub keeps Traffic data (views / unique clones) for only 14 days. This
# workflow snapshots it weekly and appends to a CSV so there is an unbroken history.
#
# WHERE IT WRITES: an ORPHAN branch named `repo-stats`, never `main`. The branch shares
# no history with main and holds only the CSV, so weekly bot commits cannot bury the
# real commit history of a repo that is itself a work artifact. Nothing on main changes.
#
# FIRST RUN: after this lands on main, go to Actions -> repo-stats -> "Run workflow" to
# capture a snapshot immediately, rather than waiting for the first Monday. The 14-day
# window means every week you wait is a week of data that cannot be recovered later.
#
# READING IT LATER:  git fetch origin repo-stats && git show origin/repo-stats:metrics/traffic.csv
# or just browse to the `repo-stats` branch on github.com.
#
# ⚠️ AUTH CAVEAT — read before relying on it:
#   The Traffic API needs *push/admin* access. The built-in GITHUB_TOKEN below works
#   in many repos but some report 403 on /traffic. If you get 403 in the Action log:
#     1. Create a fine-grained PAT with "Administration: read-only" on anchorkey
#        (or a classic PAT with the `repo` scope).
#     2. Add it as a repo secret named TRAFFIC_TOKEN.
#     3. Replace ${{ secrets.GITHUB_TOKEN }} below with ${{ secrets.TRAFFIC_TOKEN }}.
# ─────────────────────────────────────────────────────────────────────────────
name: repo-stats

on:
  schedule:
    - cron: "0 9 * * 1"   # every Monday 09:00 UTC (inside the 14-day window)
  workflow_dispatch: {}    # allow manual runs from the Actions tab

permissions:
  contents: write          # needed to commit the CSV back

concurrency:
  group: repo-stats        # never let two snapshots race each other
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Switch to the orphan stats branch
        run: |
          set -euo pipefail
          git config user.name  "repo-stats-bot"
          git config user.email "actions@github.com"

          if git ls-remote --exit-code --heads origin repo-stats >/dev/null 2>&1; then
            git fetch origin repo-stats --depth=1
            git switch repo-stats
          else
            # First run: create a branch with NO history and an empty tree, so main's
            # files are never carried onto it.
            git switch --orphan repo-stats
            # On modern git, `switch --orphan` already leaves an empty index and worktree,
            # so these two are no-ops (hence the silencing: otherwise `git rm` prints a
            # harmless "fatal: pathspec '.' did not match any files"). They are kept as the
            # cleanup path for older git, where `--orphan` carries main's files across.
            git rm -rf --cached . -q >/dev/null 2>&1 || true
            git clean -fdq >/dev/null 2>&1 || true
            printf '%s\n' \
              '# repo-stats' '' \
              'Automated weekly snapshots of this repository'"'"'s GitHub Traffic data.' '' \
              'GitHub retains Traffic (views / clones) for only 14 days; this branch keeps' \
              'an unbroken record. Generated by .github/workflows/repo-stats.yml on main.' '' \
              'This branch deliberately shares no history with main and contains no source code.' \
              > README.md
          fi

      - name: Fetch traffic and append to CSV
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # swap to TRAFFIC_TOKEN if you hit 403
          REPO: ${{ github.repository }}           # e.g. saharah-99/anchorkey
        run: |
          set -euo pipefail
          mkdir -p metrics
          FILE=metrics/traffic.csv
          if [ ! -f "$FILE" ]; then
            echo "date,views_14d,unique_visitors_14d,clones_14d,unique_clones_14d,stars,forks" > "$FILE"
          fi

          api() { curl -sf -H "Authorization: Bearer $GH_TOKEN" \
                          -H "Accept: application/vnd.github+json" "$1"; }

          VIEWS=$(api "https://api.github.com/repos/$REPO/traffic/views")
          CLONES=$(api "https://api.github.com/repos/$REPO/traffic/clones")
          REPOJSON=$(api "https://api.github.com/repos/$REPO")

          v=$(echo "$VIEWS"   | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['count'],d['uniques'])")
          c=$(echo "$CLONES"  | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['count'],d['uniques'])")
          s=$(echo "$REPOJSON"| python3 -c "import sys,json;d=json.load(sys.stdin);print(d['stargazers_count'],d['forks_count'])")

          echo "$(date -u +%F),$v,$c,$s" | tr ' ' ',' >> "$FILE"
          echo "appended: $(tail -1 "$FILE")"

      - name: Commit and push to the stats branch
        run: |
          set -euo pipefail
          git add -A
          git diff --staged --quiet || git commit -m "chore(stats): traffic snapshot $(date -u +%F) [skip ci]"
          git push -u origin repo-stats
